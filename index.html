<style>
  :root {
    /* 키비주얼(블랙 버전)에서 추출한 톤 */
    --bg: #332d2b;           /* 차콜 */
    --poster: #221a16;       /* 메인 포스터 배경색 (첫 화면이 포스터와 이어지도록) */
    --bg-deep: #2a2523;
    --card: #3d3633;
    --ink: #f3ede4;
    --muted: #a99f93;
    --line: rgba(202,172,107,.22);
    --gold: #caac6b;
    --gold-deep: #9c8155;
    --gold-grad: linear-gradient(100deg, #7a6548 0%, #caac6b 55%, #d9bf86 100%);
    --sun: #e0907f;
    --sat: #93b1d6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: #1f1b1a;
    color: var(--ink);
    font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    line-height: 1.8;
    word-break: keep-all;
  }
  .wrap {
    max-width: 430px;
    margin: 0 auto;
    background: var(--bg);
    min-height: 100vh;
    overflow: hidden;
    position: relative;
  }
  section { padding: 76px 28px; text-align: center; position: relative; }
  section.alt { background: var(--bg-deep); }
  section > * { position: relative; }
  .eng {
    font-family: 'Montserrat', sans-serif; font-weight: 600;
    letter-spacing: .32em; color: var(--gold); font-size: 12px;
    margin-bottom: 10px; padding-left: .32em;
  }
  .sec-title { font-size: 22px; font-weight: 700; margin-bottom: 32px; letter-spacing: -.01em; }
  .lead { font-size: 15px; line-height: 2; font-weight: 300; }
  .note {
    background: var(--card); border-left: 2px solid var(--gold); border-radius: 4px 10px 10px 4px;
    padding: 14px 16px; font-size: 13.5px; line-height: 1.8; text-align: left; margin-top: 24px; font-weight: 300;
  }
  .note b { color: var(--gold); font-weight: 600; }

  /* ---------- 장식: 동심원 아크 · 도트 그리드 · 골드 원 (키비주얼 모티프) ---------- */
  .deco-arcs::before {
    content: ''; position: absolute; width: 220px; height: 220px; pointer-events: none;
    top: -110px; right: -110px; border-radius: 50%;
    background: repeating-radial-gradient(circle, transparent 0 9px, rgba(202,172,107,.28) 9px 10px);
    -webkit-mask: radial-gradient(circle, transparent 38%, #000 39%);
            mask: radial-gradient(circle, transparent 38%, #000 39%);
  }
  .deco-arcs.left::before { right: auto; left: -110px; top: auto; bottom: -110px; }
  .deco-dots::after {
    content: ''; position: absolute; width: 84px; height: 56px; pointer-events: none;
    right: 20px; bottom: 28px; opacity: .55;
    background: radial-gradient(circle, var(--gold) 1px, transparent 1.5px) 0 0 / 8px 8px;
  }
  .deco-moon::before {
    content: ''; position: absolute; width: 260px; height: 260px; pointer-events: none;
    left: -150px; top: -150px; border-radius: 50%;
    background: linear-gradient(135deg, transparent 20%, rgba(202,172,107,.35) 100%);
  }

  /* ---------- 등장 애니메이션 ---------- */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 1s ease, transform 1s ease; }
  .reveal.on { opacity: 1; transform: none; }

  /* ---------- 1·2. 키비주얼 + 헤드라인 ---------- */
  .cover { padding: 0 0 64px; background: var(--poster); }
  .kv { position: relative; background: var(--poster); color: #fff; }
  .kv img { width: 100%; height: auto; display: block; aspect-ratio: 1415 / 2000; }
  .kv.fallback { aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center; flex-direction: column; }
  .kv.fallback .fifty { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 96px; line-height: 1; background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .kv.fallback .hc { font-family: 'Montserrat', sans-serif; font-weight: 300; letter-spacing: .2em; color: var(--gold); margin-top: 8px; }
  .cover .headline { font-size: 15px; line-height: 1.9; margin: 44px 28px 0; font-weight: 300; }
  .cover .headline strong { display: block; font-size: 18px; font-weight: 700; color: var(--gold); margin-bottom: 4px; }
  .when-where {
    display: inline-grid; grid-template-columns: auto 1fr; gap: 10px 14px; margin-top: 30px; text-align: left;
    padding: 16px 22px; border: 1px solid var(--line); border-radius: 10px; background: rgba(42,37,35,.6);
    font-size: 14.5px; line-height: 1.6; font-weight: 300;
  }
  .when-where dt { color: var(--gold); font-weight: 600; }
  .when-where dd { word-break: keep-all; }
  .when-where dd small { display: block; color: var(--muted); font-size: 12.5px; }

  /* ---------- 3. 인사말 ---------- */
  .greeting p { font-size: 15px; line-height: 2.1; font-weight: 300; word-break: keep-all; text-wrap: pretty; }
  .greeting #greeting > * + * { margin-top: 24px; }
  .greeting .g-info {
    display: inline-grid; grid-template-columns: auto 1fr; gap: 10px 14px; text-align: left;
    padding: 18px 22px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    font-size: 14.5px; line-height: 1.6; font-weight: 300;
  }
  .greeting .g-info dt { color: var(--gold); font-weight: 600; }
  .greeting .g-info dd { word-break: keep-all; }
  .greeting .g-note { font-size: 13px; color: var(--muted); }
  .greeting .sign { margin-top: 40px; font-size: 15px; color: var(--ink); font-weight: 600; letter-spacing: .02em; word-break: keep-all; }
  .greeting .contact { margin-top: 28px; font-size: 12.5px; line-height: 1.8; color: var(--muted); word-break: keep-all; }
  .greeting .contact a { color: var(--gold); text-decoration: none; border-bottom: 1px solid var(--gold-deep); }

  /* ---------- 4. 식순 타임라인 ---------- */
  .timeline { list-style: none; text-align: left; position: relative; margin: 0 auto; max-width: 340px; }
  .timeline::before { content: ''; position: absolute; left: 109px; top: 10px; bottom: 10px; width: 1px; background: var(--line); }
  .timeline li { display: grid; grid-template-columns: 92px 1fr; gap: 34px; padding: 10px 0; position: relative; }
  .timeline li::before {
    content: ''; position: absolute; left: 105px; top: 18px; width: 9px; height: 9px; border-radius: 50%;
    background: var(--bg); border: 1.5px solid var(--gold);
  }
  .timeline li.key::before { background: var(--gold); box-shadow: 0 0 0 3px rgba(202,172,107,.2); }
  .timeline .t { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 13px; color: var(--gold); text-align: right; padding-top: 2px; white-space: nowrap; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .timeline .w { font-size: 15px; font-weight: 500; word-break: keep-all; }
  .timeline .w small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.6; font-weight: 300; }

  .program-sec .btn.full { margin-top: 24px; }
  .program-sec .deadline { color: var(--muted); font-size: 13px; margin-top: 12px; }

  /* ---------- 버튼 ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: 1px solid var(--line); background: transparent; color: var(--ink);
    font-family: inherit; font-size: 14px; padding: 12px 22px; border-radius: 999px; cursor: pointer;
    text-decoration: none; transition: background .2s, opacity .2s, filter .2s;
  }
  .btn:active { background: rgba(202,172,107,.12); }
  .btn.full { width: 100%; border-radius: 10px; padding: 15px 22px; }
  .btn.primary { background: var(--gold-grad); color: #231f1d; border: 0; font-weight: 700; }
  .btn.primary:active { filter: brightness(.9); }
  .btn.kakao { background: #fee500; border-color: #fee500; color: #191919; font-weight: 600; }
  .btn[aria-disabled="true"] { opacity: .4; pointer-events: none; }
  .btn[hidden] { display: none; }

  /* ---------- 5. 동문 발전기금 ---------- */
  .fund-note { font-size: 13px; color: var(--muted); margin-top: 14px; word-break: keep-all; }
  .fund-sec .btn.full { margin-top: 28px; }



  /* ---------- 7. 카카오톡 채널 ---------- */
  .kakao-card {
    display: flex; align-items: center; gap: 14px; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 14px;
  }
  .kakao-card .logo { width: 48px; height: 48px; border-radius: 14px; background: #fff; flex-shrink: 0; object-fit: cover; }
  .kakao-card b { display: block; font-size: 15px; font-weight: 600; }
  .kakao-card span { font-size: 13px; color: var(--muted); font-weight: 300; }

  /* ---------- 8. 갤러리 ---------- */
  .gallery-sec { padding-left: 16px; padding-right: 16px; }
  .gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .gallery .g {
    aspect-ratio: 1; border-radius: 2px; overflow: hidden; cursor: pointer; position: relative;
    display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.7);
    font-family: 'Montserrat', sans-serif; font-size: 18px; font-weight: 300;
  }
  .gallery .g img { width: 100%; height: 100%; object-fit: cover; filter: sepia(.12); }
  .gallery .g .cap {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 5px; font-size: 11px;
    font-family: 'Pretendard', sans-serif; color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.6));
  }
  .more-btn { margin-top: 22px; }

  .lightbox {
    position: fixed; inset: 0; z-index: 120; background: #141110;
    display: none; flex-direction: column; justify-content: center; overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .lightbox.open { display: flex; }
  .lightbox .stage { width: 100%; overflow: hidden; cursor: grab; }
  .lightbox .stage.dragging { cursor: grabbing; }
  .lightbox .track { display: flex; will-change: transform; }
  .lightbox .track.anim { transition: transform .35s cubic-bezier(.25,.8,.3,1); }
  .lightbox .slide {
    flex: 0 0 100%; height: calc(100dvh - 120px); padding: 0 12px;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-family: 'Montserrat', sans-serif; font-size: 40px;
  }
  .lightbox .slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 2px; pointer-events: none; -webkit-user-drag: none; }
  .lightbox .slide > div { width: min(100%, 406px); aspect-ratio: 3/4; }
  .lightbox .count { color: #bbb; font-size: 13px; margin-top: 14px; text-align: center; font-variant-numeric: tabular-nums; }
  .lightbox button { position: absolute; z-index: 1; background: none; border: 0; color: #fff; font-size: 28px; padding: 16px; cursor: pointer; }
  .lightbox button[hidden] { display: none; }
  .lightbox .close { top: calc(4px + env(safe-area-inset-top)); right: 4px; }
  .lightbox .prev { left: max(0px, calc(50% - 300px)); top: 50%; transform: translateY(-50%); }
  .lightbox .next { right: max(0px, calc(50% - 300px)); top: 50%; transform: translateY(-50%); }
  body.lb-lock { overflow: hidden; }

  /* ---------- 오시는 길 ---------- */
  .place-name { font-size: 18px; font-weight: 600; }
  .place-addr { color: var(--muted); font-size: 14px; margin-bottom: 24px; font-weight: 300; }
  .map { width: 100%; aspect-ratio: 4/3; border: 0; border-radius: 8px; background: var(--card); filter: grayscale(.3) contrast(.95); }
  .map-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .map-links .btn { padding: 10px 0; border-radius: 8px; font-size: 13px; }
  .transport { text-align: left; margin-top: 36px; }
  .transport dt { font-family: 'Montserrat', sans-serif; font-weight: 600; letter-spacing: .2em; color: var(--gold); font-size: 11.5px; margin-top: 22px; }
  .transport dd { font-size: 14px; line-height: 1.9; border-bottom: 1px solid var(--line); padding: 4px 0 16px; font-weight: 300; word-break: keep-all; }
  .transport dd a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--gold-deep); }
  .subway-line {
    display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; margin-right: 2px;
    border-radius: 50%; color: #fff; font: 600 11px/1 'Montserrat', sans-serif; vertical-align: -3px;
  }

  /* ---------- 8. 메시지 남기기 ---------- */
  .guestbook .lead { margin-bottom: 26px; }
  .gb-form .field .hint { text-align: right; }
  .gb-list { display: grid; gap: 10px; margin-top: 28px; text-align: left; }
  .gb-item { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .gb-item .who { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 13px; }
  .gb-item .who b { color: var(--gold); font-weight: 600; }
  .gb-item .who time { color: var(--muted); font-size: 11.5px; font-family: 'Montserrat', sans-serif; flex-shrink: 0; }
  .gb-item p { font-size: 14px; line-height: 1.75; font-weight: 300; margin-top: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .gb-empty { color: var(--muted); font-size: 13px; text-align: center; padding: 8px 0; }

  /* ---------- 공유 ---------- */
  .share { display: grid; gap: 10px; }
  footer { text-align: center; padding: 28px 0 52px; font-size: 11.5px; color: var(--muted); background: var(--bg-deep); letter-spacing: .02em; }

  /* ---------- 입력 폼 (방명록) ---------- */
  .field { margin-bottom: 16px; text-align: left; }
  .field > label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field textarea {
    width: 100%; font-family: inherit; font-size: 15px; color: var(--ink);
    border: 1px solid rgba(255,255,255,.1); border-radius: 8px; padding: 12px 14px; background: var(--card);
    -webkit-appearance: none; appearance: none; color-scheme: dark;
  }
  .field input::placeholder, .field textarea::placeholder { color: #7d746b; }
  .field textarea { resize: vertical; min-height: 104px; line-height: 1.7; }
  .field input:focus, .field textarea:focus { outline: 2px solid rgba(202,172,107,.3); border-color: var(--gold); }
  .field .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .hp { position: absolute; left: -9999px; }
  .form-err { color: var(--sun); font-size: 13px; margin-bottom: 10px; min-height: 1em; }

  .toast {
    position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%) translateY(20px);
    background: rgba(202,172,107,.95); color: #231f1d; font-size: 13px; font-weight: 600; padding: 10px 18px;
    border-radius: 999px; opacity: 0; transition: .3s; z-index: 80; pointer-events: none; white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* ---------- 인트로 (헤드라인 써지는 애니메이션) ---------- */
  .intro {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(ellipse at 50% 42%, #3d3532 0%, #2a2523 55%, #1a1716 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; text-align: center; cursor: pointer; overflow: hidden;
    transition: opacity 1.2s ease, visibility 1.2s;
  }
  .intro.hide { opacity: 0; visibility: hidden; }
  .intro .mark {
    font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 44px; line-height: 1;
    background: var(--gold-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
    margin-bottom: 26px; opacity: 0; animation: introFade 1.4s ease .2s forwards;
  }
  .intro .text { color: var(--ink); font-size: 19px; line-height: 2.1; max-width: 340px; font-weight: 300; position: relative; }
  .intro .text .ch {
    display: inline-block; opacity: 0; filter: blur(6px);
    clip-path: inset(0 100% 0 0);
    animation: write .5s cubic-bezier(.3,.6,.4,1) forwards;
  }
  .intro .text .em { color: var(--gold); font-weight: 700; }
  .intro .line { width: 0; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin-top: 30px; transition: width 1.2s ease; }
  .intro .line.on { width: 140px; }
  .intro .skip {
    position: absolute; bottom: calc(28px + env(safe-area-inset-bottom)); left: 0; right: 0;
    font-size: 12px; color: rgba(243,237,228,.38); letter-spacing: .08em;
    opacity: 0; animation: introFade 1s ease 1.5s forwards;
  }
  .intro::before, .intro::after {
    content: ''; position: absolute; border-radius: 50%; pointer-events: none;
    background: linear-gradient(135deg, transparent 25%, rgba(202,172,107,.4) 100%);
  }
  .intro::before { width: 320px; height: 320px; left: -180px; top: -180px; }
  .intro::after { width: 280px; height: 280px; right: -150px; bottom: -140px; transform: rotate(180deg); }
  @keyframes write { to { opacity: 1; filter: blur(0); clip-path: inset(0 0 0 0); } }
  @keyframes introFade { to { opacity: 1; } }
  body.intro-lock { overflow: hidden; }

  /* ---------- 배경음악 버튼 ---------- */
  .bgm {
    position: fixed; z-index: 110;
    top: calc(8px + env(safe-area-inset-top));
    right: max(8px, calc(50% - 215px + 8px));   /* 430px 본문 기준 우측 상단 */
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(31,27,26,.55); border: 1px solid var(--line); color: var(--gold);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .bgm svg { width: 16px; height: 16px; }
  .bgm .off, .bgm.playing .on { display: block; }
  .bgm .on, .bgm.playing .off { display: none; }
  .bgm.playing::after {
    content: ''; position: absolute; inset: -1px; border-radius: 50%;
    border: 1px solid var(--gold); opacity: 0; animation: bgmPulse 2.4s ease-out infinite;
  }
  @keyframes bgmPulse { 0% { opacity: .6; transform: scale(1); } 100% { opacity: 0; transform: scale(1.45); } }

  @media (prefers-reduced-motion: reduce) {
    .reveal { opacity: 1; transform: none; transition: none; }
    .intro .text .ch { animation: none; opacity: 1; filter: none; clip-path: none; }
  }
</style>
</head>
<body class="intro-lock">
<div class="intro" id="intro" role="dialog" aria-label="인트로">
  <div class="mark" aria-hidden="true">50</div>
  <p class="text" id="introText"></p>
  <div class="line" id="introLine"></div>
  <div class="skip">화면을 누르면 바로 시작합니다</div>
</div>
<button type="button" class="bgm" id="bgm" aria-label="배경음악 켜기" aria-pressed="false">
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="m16 9 6 6M22 9l-6 6"/></svg>
</button>
<main class="wrap">
  <!-- 1·2. 메인 포스터 + 초대 글귀 + 일시·장소 -->
  <section class="cover deco-dots">
    <div class="kv" id="kv"></div>
    <p class="headline reveal" id="headline"></p>
    <dl class="when-where reveal" id="whenWhere"></dl>
  </section>

  <!-- 3. 모시는 글 -->
  <section class="greeting alt deco-arcs">
    <div class="eng reveal">GREETING</div>
    <div class="sec-title reveal">모시는 글</div>
    <div id="greeting"></div>
    <div class="sign reveal" id="sign"></div>
    <p class="contact reveal" id="contact"></p>
  </section>

  <!-- 4. 식순 + 참석 여부 응답 -->

const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const br = s => esc(s).replace(/\n/g, '<br>');
const when = new Date(CONFIG.date);
const DAYS_KO = ['일','월','화','수','목','금','토'];
const h = when.getHours(), ampmKo = h < 12 ? '오전' : '오후', h12 = h % 12 || 12;

function toast(msg) {

  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1800);
}
function setLink(el, url) {
  if (url) el.href = url;
  else { el.removeAttribute('href'); el.setAttribute('aria-disabled', 'true'); el.textContent += ' (준비 중)'; }
}

/* 인트로 — 어두운 화면에 헤드라인이 한 글자씩 써짐 */
(() => {
  const intro = $('#intro'), box = $('#introText');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const STEP = 75;                        // 글자 간격(ms)
  const HIGHLIGHT = /창립\s?\d+주년|홈커밍데이/g;
  // 강조 구간 표시
  const marks = [];
  const TEXT = CONFIG.introText || CONFIG.headline;
  TEXT.replace(HIGHLIGHT, (m, i) => { marks.push([i, i + m.length]); return m; });
  // 단어 단위로 묶어 줄바꿈이 단어 중간에서 일어나지 않게 함
  let delay = 700, html = '', word = '';
  const flush = () => { if (word) { html += `<span style="white-space:nowrap">${word}</span>`; word = ''; } };
  [...TEXT].forEach((c, i) => {
    if (c === '\n') { flush(); html += '<br>'; delay += 350; return; }
    if (c === ' ') { flush(); html += ' '; delay += STEP / 2; return; }
    const em = marks.some(([a, b]) => i >= a && i < b);
    word += `<span class="ch${em ? ' em' : ''}" style="animation-delay:${delay}ms">${esc(c)}</span>`;
    delay += /[.,·]/.test(c) ? STEP * 3 : STEP;
  });
  flush();
  box.innerHTML = html;
  box.setAttribute('aria-label', TEXT.replace(/\n/g, ' '));

  const total = reduce ? 600 : delay + 500;
  let done = false;
  const finish = () => {
    if (done) return; done = true;
    intro.classList.add('hide');
    document.body.classList.remove('intro-lock');
    setTimeout(() => intro.remove(), 1300);
  };
  setTimeout(() => $('#introLine')?.classList.add('on'), total);
  setTimeout(finish, total + 1800);
  intro.addEventListener('click', finish);
})();

/* 배경음악 — 진입 시 자동 재생, 브라우저가 막으면 첫 터치 때 재생 */
(() => {
  const btn = $('#bgm'), list = CONFIG.bgm || [];
  if (!list.length) { btn.remove(); return; }
  let idx = Math.floor(Math.random() * list.length);
  let wanted = true;                      // 사용자가 끄지 않았으면 재생 상태 유지
  const audio = new Audio(list[idx]);
  audio.preload = 'auto';
  const sync = () => {
    const on = !audio.paused;
    btn.classList.toggle('playing', on);
    btn.setAttribute('aria-pressed', on);
    btn.setAttribute('aria-label', on ? '배경음악 끄기' : '배경음악 켜기');
  };
  const play = () => audio.play().catch(() => {});
  audio.addEventListener('play', sync);
  audio.addEventListener('pause', sync);
  audio.addEventListener('ended', () => { idx = (idx + 1) % list.length; audio.src = list[idx]; play(); });

  // 자동 재생이 막힌 경우: 첫 사용자 동작에서 시작
  const unlock = e => {
    if (e.target.closest('#bgm')) return;
    ['pointerdown', 'touchstart', 'keydown'].forEach(t => removeEventListener(t, unlock, true));
    if (wanted && audio.paused) play();
  };
  ['pointerdown', 'touchstart', 'keydown'].forEach(t => addEventListener(t, unlock, true));
  play();

  btn.addEventListener('click', () => {
    wanted = audio.paused;
    wanted ? play() : audio.pause();
  });
  // 다른 앱/탭으로 나가면 멈추고, 돌아오면 이어서 재생
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) audio.pause();
    else if (wanted) play();
  });
})();

const SAMPLE_TONES = ['#4a413c','#5c5046','#3f3834','#6b5d4c','#4f4540','#57493d','#443b36','#62564a','#4b423c','#5a4d41','#40383a','#665748'];

  : big
    ? `<img data-src="${esc(p.src)}" alt="${esc(p.cap || '추억의 사진')}">`
    : `<img src="${esc(p.thumb || thumbOf(p.src))}" onerror="this.onerror=null;this.src='${esc(p.src)}'" alt="${esc(p.cap || '추억의 사진')}" loading="lazy">${p.cap ? `<span class="cap">${esc(p.cap)}</span>` : ''}`;
$('#gallery').innerHTML = photos.map((p, i) => `<div class="g" data-i="${i}">${tileHtml(p, i)}</div>`).join('');

/* 사진 크게 보기 — 좌우로 밀어서 이전/다음 사진 */
const lb = $('#lightbox'), track = $('#lbTrack'), stage = $('#lbStage');
track.innerHTML = photos.map((p, i) => `<div class="slide">${tileHtml(p, i, true)}</div>`).join('');
const slides = [...track.children];
let lbIdx = 0;
const moveTo = (x, anim) => {
  track.classList.toggle('anim', anim);
  track.style.transform = `translateX(calc(${-lbIdx * 100}% + ${x}px))`;
};
function showLb(i, anim = true) {
  lbIdx = Math.max(0, Math.min(photos.length - 1, i));
  // 현재 사진과 양옆 사진만 불러옴
  [lbIdx - 1, lbIdx, lbIdx + 1].forEach(k => {
    const img = slides[k] && slides[k].querySelector('img[data-src]');
    if (img) { img.src = img.dataset.src; img.removeAttribute('data-src'); }
  });
  const p = photos[lbIdx];
  $('#lbCount').textContent = `${lbIdx + 1} / ${photos.length}${p.cap ? ' · ' + p.cap : ''}`;
  $('#lightbox .prev').hidden = lbIdx === 0;
  $('#lightbox .next').hidden = lbIdx === photos.length - 1;
  moveTo(0, anim);
}
function openLb(i) {
  lb.classList.add('open');
  document.body.classList.add('lb-lock');
  showLb(i, false);
}
function closeLb() {
  lb.classList.remove('open');
  document.body.classList.remove('lb-lock');
}
$('#gallery').onclick = e => { const g = e.target.closest('.g'); if (g) openLb(+g.dataset.i); };
$('#lightbox .close').onclick = closeLb;
lb.addEventListener('click', e => { if (e.target === lb || e.target.id === 'lbCount') closeLb(); });
$('#lightbox .prev').onclick = () => showLb(lbIdx - 1);
$('#lightbox .next').onclick = () => showLb(lbIdx + 1);
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  else if (e.key === 'ArrowLeft') showLb(lbIdx - 1);
  else if (e.key === 'ArrowRight') showLb(lbIdx + 1);
});

// 손가락(마우스)을 따라 사진이 움직이고, 충분히 밀면 넘어감
let drag = null;
const onPhoto = e => {
  const el = slides[lbIdx].firstElementChild;
  if (!el) return false;
  const r = el.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
};
stage.addEventListener('pointerdown', e => {
  drag = { x: e.clientX, y: e.clientY, dx: 0, t: Date.now() };
  stage.setPointerCapture(e.pointerId);
  stage.classList.add('dragging');
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  drag.dx = e.clientX - drag.x;
  const atEdge = (drag.dx > 0 && lbIdx === 0) || (drag.dx < 0 && lbIdx === photos.length - 1);
  moveTo(atEdge ? drag.dx / 3 : drag.dx, false);   // 처음/마지막 사진에서는 살짝만 밀림
});
const endDrag = e => {
  if (!drag) return;
  const { dx, y, t } = drag; drag = null;
  stage.classList.remove('dragging');
  const fast = Math.abs(dx) > 20 && Date.now() - t < 250;
  if (Math.abs(dx) > stage.clientWidth * 0.18 || fast) showLb(lbIdx + (dx < 0 ? 1 : -1));
  else if (Math.abs(dx) < 6 && Math.abs(e.clientY - y) < 6 && !onPhoto(e)) closeLb();  // 사진 바깥을 탭하면 닫기
  else showLb(lbIdx);
};
stage.addEventListener('pointerup', endDrag);
stage.addEventListener('pointercancel', endDrag);

/* 오시는 길 */
$('#place-name').textContent = CONFIG.placeName;
$('#place-addr').textContent = CONFIG.address;
const q = encodeURIComponent(CONFIG.mapQuery || CONFIG.address);
$('#map').src = `https://maps.google.com/maps?q=${q}&z=16&output=embed`;
$('#naverMap').href = `https://map.naver.com/p/search/${q}`;
$('#kakaoMap').href = `https://map.kakao.com/link/search/${q}`;
$('#tmap').href = `https://tmap.life/search?name=${q}`;
const LINE_COLORS = { 1: '#0052a4', 2: '#00a84d', 3: '#ef7c1c', 4: '#00a5de', 5: '#996cac', 6: '#cd7c2f', 7: '#747f00', 8: '#e6186c', 9: '#bdb092' };
$('#transport').innerHTML = CONFIG.transport.map(x => `<dt>${esc(x.t)}</dt><dd>${
  br(x.d)
    .replace(/\{(\d)\}/g, (_, n) => `<span class="subway-line" style="background:${LINE_COLORS[n] || '#888'}">${n}</span>`)
    .replace(/(0\d{1,2}-\d{3,4}-\d{4})/g, n => `<a href="tel:${n.replace(/-/g, '')}">${n}</a>`)
}</dd>`).join('');

/* 복사 */
async function copy(text, msg) {
  try { await navigator.clipboard.writeText(text); }
  catch { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  toast(msg);
}

/* 8. 메시지 남기기 (방명록) — rsvp/Code.gs 의 '방명록' 시트에 저장 */
(() => {
  const form = $('#gbForm'), list = $('#gbList'), err = $('#gbErr'), submit = $('#gbSubmit'), more = $('#gbMore');
  const PAGE = 5;
  let items = [], shown = PAGE;
  $('#gbLead').innerHTML = br(CONFIG.gbLead);
  // 서버가 "… GMT+0900 (한국 표준시)" 형식으로 줄 때 괄호 부분은 떼고 읽음 (Safari 대응)
  const fmt = t => { const d = new Date(String(t).replace(/\s*\(.*\)\s*$/, '')); return isNaN(d) ? '' : `${d.getFullYear()}. ${d.getMonth()+1}. ${d.getDate()}.`; };
  const render = () => {
    list.innerHTML = items.length
      ? items.slice(0, shown).map(m =>
          `<div class="gb-item"><div class="who"><b>${esc(m.name)}</b><time>${fmt(m.time)}</time></div><p>${esc(m.message)}</p></div>`).join('')
      : '<p class="gb-empty">첫 번째 축하 메시지를 남겨주세요.</p>';
    more.hidden = items.length <= shown;
  };
  more.onclick = () => { shown += PAGE * 2; render(); };
  $('#gb-msg').addEventListener('input', e => { $('#gbLen').textContent = e.target.value.length; });

  (async () => {
    if (CONFIG.gbEndpoint) {
      try {
        const out = await (await fetch(`${CONFIG.gbEndpoint}?action=guestbook`)).json();
        if (Array.isArray(out.entries)) items = out.entries;
      } catch {}
    }
    render();
  })();

  form.onsubmit = async e => {
    e.preventDefault();
    err.textContent = '';
    const fd = new FormData(form);
    if (fd.get('website')) return;   // 스팸 봇 차단용 숨김 필드
    const name = fd.get('name').trim(), message = fd.get('message').trim();
    if (!name) { err.textContent = '이름을 입력해 주세요.'; return $('#gb-name').focus(); }
    if (!message) { err.textContent = '메시지를 입력해 주세요.'; return $('#gb-msg').focus(); }

    submit.disabled = true; submit.textContent = '등록 중…';
    try {
      if (CONFIG.gbEndpoint) {
        const res = await fetch(CONFIG.gbEndpoint, { method: 'POST', body: JSON.stringify({ type: 'guestbook', name, message }) });
        const out = await res.json();
        if (!out.ok) throw new Error(out.error || 'fail');
      }
      items.unshift({ name, message, time: new Date().toISOString() });
      render();
      form.reset(); $('#gbLen').textContent = '0';
      toast('메시지가 등록되었습니다');
    } catch {
      err.textContent = '등록에 실패했습니다. 잠시 후 다시 시도해 주세요.';
    } finally {
      submit.disabled = false; submit.textContent = '메시지 남기기';
    }
  };
})();

/* 10. 공유 — 카카오톡 공유(키가 있을 때) → 휴대폰 공유창 → 주소 복사 순으로 시도 */
const meta = n => (document.querySelector(`meta[property="${n}"]`) || {}).content || '';
async function shareKakao() {
  if (!window.Kakao) {
    await new Promise((ok, no) => {
      const sc = document.createElement('script');
      sc.src = 'https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js';
      sc.crossOrigin = 'anonymous'; sc.onload = ok; sc.onerror = no;
      document.head.appendChild(sc);
    });
  }
  if (!Kakao.isInitialized()) Kakao.init(CONFIG.kakaoJsKey);
  const link = { mobileWebUrl: location.href, webUrl: location.href };
  Kakao.Share.sendDefault({
    objectType: 'feed',
    content: { title: meta('og:title') || document.title, description: meta('og:description'), imageUrl: meta('og:image'), link },
    buttons: [{ title: '초대장 보기', link }],
  });
}
$('#copyBtn').onclick = () => copy(location.href, '초대장 주소가 복사되었습니다');
$('#shareBtn').onclick = async () => {
  if (CONFIG.kakaoJsKey) { try { return await shareKakao(); } catch {} }
  if (navigator.share) { try { await navigator.share({ title: document.title, url: location.href }); } catch {} }
  else copy(location.href, '초대장 주소가 복사되었습니다');
};
$('#footer').textContent = `${CONFIG.univ} ${CONFIG.dept} 총동문회`;

/* 스크롤 등장 효과 */
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('on'); io.unobserve(e.target); } }), { threshold: .15 });
document.querySelectorAll('.reveal').forEach(el => io.observe(el));
</script>
</body>
</html>
